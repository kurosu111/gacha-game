<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>ガチャローグ Prototype</title>
<style>
  :root{
    --bg:#0b1020; --panel:#151b31; --panel2:#1e2746; --text:#f5f7ff;
    --muted:#9aa7c7; --accent:#8f7cff; --accent2:#49d6ff; --danger:#ff6584;
    --gold:#ffd166; --green:#62e6a6;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:
      radial-gradient(circle at top, #1d2853 0%, #0b1020 45%, #080b15 100%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #app{max-width:460px;margin:0 auto;min-height:100vh;padding:14px 14px 120px}
  .topbar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:12px}
  .logo{font-weight:900;letter-spacing:.08em;font-size:18px}
  .resources{display:flex;gap:8px;font-size:13px}
  .chip{background:#ffffff10;border:1px solid #ffffff1a;border-radius:999px;padding:7px 10px}
  .card{
    background:linear-gradient(180deg,#18213b,#11182c); border:1px solid #ffffff18;
    border-radius:18px; padding:14px; box-shadow:0 14px 30px #00000033; margin-bottom:12px;
  }
  .hero{padding:18px;background:
    linear-gradient(135deg,#7f67ff33,#49d6ff18),linear-gradient(180deg,#202a4d,#12192f)}
  h1,h2,h3,p{margin-top:0}
  h1{font-size:24px;margin-bottom:8px}
  h2{font-size:18px;margin-bottom:10px}
  .sub{color:var(--muted);font-size:13px;line-height:1.55}
  .btn{
    width:100%; border:0; border-radius:14px; padding:13px 14px; font-weight:800;
    font-size:15px; color:white; background:linear-gradient(135deg,var(--accent),#6b5cff);
    margin-top:8px; box-shadow:0 8px 18px #6d5cff2f;
  }
  .btn.secondary{background:#263252;box-shadow:none}
  .btn.gold{background:linear-gradient(135deg,#d99e25,#ffbf45);color:#17130a}
  .btn.danger{background:linear-gradient(135deg,#ff597c,#e84367)}
  .btn:disabled{opacity:.42}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .unit{
    padding:10px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff14;
    min-height:110px;position:relative
  }
  .unit .rarity{font-size:11px;font-weight:900}
  .unit .name{font-size:13px;font-weight:800;margin-top:7px}
  .unit .stat{font-size:11px;color:var(--muted);margin-top:5px}
  .SSR{color:#ffd166}.SR{color:#b69cff}.R{color:#79d7ff}.N{color:#b5bfce}
  .selected{outline:2px solid var(--accent2);background:#49d6ff12}
  .battlefield{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fighter{padding:12px;border-radius:14px;background:#ffffff0b;border:1px solid #ffffff14}
  .hpbar{height:10px;background:#ffffff12;border-radius:999px;overflow:hidden;margin:8px 0}
  .hpfill{height:100%;background:linear-gradient(90deg,#53de9b,#9aea63)}
  .enemy .hpfill{background:linear-gradient(90deg,#ff718d,#ffb05f)}
  .log{
    height:150px;overflow:auto;background:#080c18;border-radius:12px;padding:10px;
    color:#cbd4ea;font-size:12px;line-height:1.55;border:1px solid #ffffff0e
  }
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .choice .btn{min-height:82px;margin:0}
  .tiny{font-size:11px;color:var(--muted)}
  .upgrade{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff10}
  .upgrade:last-child{border-bottom:none}
  .badge{display:inline-block;padding:4px 7px;border-radius:8px;background:#ffffff10;font-size:11px;margin-right:5px}
  .bottomnav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,#0b102000,#0b1020 22%,#0b1020 100%);
  }
  .navinner{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#12192fdd;backdrop-filter:blur(12px);border:1px solid #ffffff18;border-radius:18px;padding:8px}
  .navbtn{border:0;background:transparent;color:#8f9bb8;padding:9px 4px;border-radius:12px;font-weight:800;font-size:12px}
  .navbtn.active{color:#fff;background:#ffffff12}
  .pulse{animation:pulse .7s ease}
  @keyframes pulse{0%{transform:scale(.95);opacity:.5}100%{transform:scale(1);opacity:1}}
  .resultline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0d}
</style>
</head>
<body>
<div id="app"></div>
<div class="bottomnav">
  <div class="navinner">
    <button class="navbtn active" data-page="home">拠点</button>
    <button class="navbtn" data-page="gacha">ガチャ</button>
    <button class="navbtn" data-page="party">編成</button>
    <button class="navbtn" data-page="map">進行</button>
  </div>
</div>

<script>
const CHARACTERS = [
  {name:"アカリ",rarity:"SSR",atk:18,hp:72,skill:"灼熱"},
  {name:"ルナ",rarity:"SSR",atk:16,hp:78,skill:"月蝕"},
  {name:"ノア",rarity:"SSR",atk:20,hp:64,skill:"零距離"},
  {name:"ミオ",rarity:"SR",atk:13,hp:62,skill:"加速"},
  {name:"レイ",rarity:"SR",atk:12,hp:68,skill:"障壁"},
  {name:"ユナ",rarity:"SR",atk:14,hp:58,skill:"連撃"},
  {name:"シロ",rarity:"R",atk:9,hp:52,skill:"応援"},
  {name:"クロ",rarity:"R",atk:10,hp:48,skill:"毒針"},
  {name:"ハナ",rarity:"R",atk:8,hp:56,skill:"治癒"},
  {name:"モブA",rarity:"N",atk:6,hp:42,skill:"気合"},
  {name:"モブB",rarity:"N",atk:5,hp:46,skill:"根性"},
  {name:"モブC",rarity:"N",atk:7,hp:38,skill:"勢い"}
];

let s = JSON.parse(localStorage.getItem("gachaRogueSave") || "null") || {
  gems: 12, gold:0, floor:1, bossFloor:5, pulls:0,
  roster:[], party:[], rateBonus:0, multiBonus:0, freeReroll:false,
  runOver:false, victories:0
};

function save(){ localStorage.setItem("gachaRogueSave",JSON.stringify(s)); }
function rarityRoll(){
  const x=Math.random()*100;
  const ssr=Math.min(35,3+s.rateBonus);
  if(x<ssr) return "SSR";
  if(x<ssr+15) return "SR";
  if(x<ssr+45) return "R";
  return "N";
}
function pullOne(){
  let r=rarityRoll();
  const pool=CHARACTERS.filter(c=>c.rarity===r);
  const c={...pool[Math.floor(Math.random()*pool.length)],id:Date.now()+Math.random()};
  s.roster.push(c); s.pulls++; return c;
}
function nav(){
  document.querySelectorAll(".navbtn").forEach(b=>{
    b.onclick=()=>render(b.dataset.page);
  });
}
function setActive(page){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
}
function render(page="home"){
  setActive(page);
  const app=document.getElementById("app");
  app.innerHTML=top()+({home:homePage,gacha:gachaPage,party:partyPage,map:mapPage}[page])();
  bind(page); save();
}
function top(){
 return `<div class="topbar"><div class="logo">GACHA ROGUE</div>
 <div class="resources"><div class="chip">💎 ${s.gems}</div><div class="chip">🪙 ${s.gold}</div></div></div>`;
}
function homePage(){
 return `<div class="card hero">
   <div class="tiny">RUN ${s.victories+1}</div>
   <h1>ガチャを壊して、塔を登れ。</h1>
   <p class="sub">引いたキャラだけで進むローグライク試作版。道中で排出率そのものを強化し、最終的に“壊れガチャ”を作る。</p>
   <div><span class="badge">SSR率 ${3+s.rateBonus}%</span><span class="badge">現在 ${s.floor}F / ${s.bossFloor}F</span></div>
 </div>
 <div class="card"><h2>現在のラン</h2>
   <p class="sub">勝利数 ${s.victories} ／ 累計ガチャ ${s.pulls}回 ／ 所持 ${s.roster.length}体</p>
   <button class="btn" data-go="gacha">まずガチャを引く</button>
   <button class="btn secondary" data-go="map">塔を進む</button>
 </div>
 <div class="card"><h2>この試作版で試せること</h2>
   <p class="sub">ガチャ、3人編成、分岐イベント、簡易バトル、ガチャ排出率強化、ボス戦まで一通り入っている。</p>
 </div>`;
}
function gachaPage(){
 return `<div class="card"><h2>召喚端末</h2>
  <p class="sub">SSR基本3%。道中の改造で確率が上がる。単発1💎、10連9💎。</p>
  <button class="btn" id="single" ${s.gems<1?"disabled":""}>単発ガチャ 1💎</button>
  <button class="btn gold" id="multi" ${s.gems<9?"disabled":""}>10連ガチャ 9💎</button>
  <div id="results" style="margin-top:12px"></div>
 </div>
 <div class="card"><h2>現在のガチャ性能</h2>
  <div class="resultline"><span>SSR率</span><b>${3+s.rateBonus}%</b></div>
  <div class="resultline"><span>10連ボーナス</span><b>+${s.multiBonus}</b></div>
  <div class="resultline"><span>所持キャラ</span><b>${s.roster.length}</b></div>
 </div>`;
}
function partyPage(){
 const cards=s.roster.map(c=>`<div class="unit ${s.party.includes(c.id)?"selected":""}" data-id="${c.id}">
  <div class="rarity ${c.rarity}">${c.rarity}</div><div class="name">${c.name}</div>
  <div class="stat">ATK ${c.atk}<br>HP ${c.hp}<br>${c.skill}</div></div>`).join("");
 return `<div class="card"><h2>3人編成</h2><p class="sub">キャラをタップして最大3人まで選択。</p>
 <div class="grid">${cards||'<p class="sub">まだキャラがいない。ガチャを引こう。</p>'}</div></div>
 <div class="card"><h2>現在の編成</h2><p class="sub">${partyNames()}</p></div>`;
}
function partyNames(){
 return s.party.map(id=>s.roster.find(c=>c.id===id)?.name).filter(Boolean).join(" / ") || "未編成";
}
function mapPage(){
 if(s.runOver){
  return `<div class="card hero"><h1>RUN CLEAR!</h1><p class="sub">ボスを撃破した。今回はここまで。</p>
   <button class="btn" id="newrun">新しいランを開始</button></div>`;
 }
 const isBoss=s.floor===s.bossFloor;
 return `<div class="card hero"><div class="tiny">${isBoss?"BOSS FLOOR":"FLOOR "+s.floor}</div>
 <h1>${isBoss?"最終ボス":"次の分岐"}</h1>
 <p class="sub">${isBoss?"ここを勝てばランクリア。":"どちらかを選んで塔を進む。"}</p></div>
 ${isBoss?
 `<div class="card"><button class="btn danger" id="boss">ボスに挑む</button></div>`:
 `<div class="choice">
  <button class="btn" id="battle">⚔️ 戦闘<br><span class="tiny">勝利で石と金</span></button>
  <button class="btn secondary" id="event">🧪 改造<br><span class="tiny">ガチャ性能を変える</span></button>
 </div>`}
 <div class="card"><h2>パーティ</h2><p class="sub">${partyNames()}</p></div>
 <div id="encounter"></div>`;
}
function bind(page){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>render(b.dataset.go));
 if(page==="gacha"){
  const single=document.getElementById("single"), multi=document.getElementById("multi");
  if(single) single.onclick=()=>doPull(1,1);
  if(multi) multi.onclick=()=>doPull(10,9);
 }
 if(page==="party"){
  document.querySelectorAll(".unit").forEach(el=>el.onclick=()=>{
   const id=Number(el.dataset.id);
   if(s.party.includes(id)) s.party=s.party.filter(x=>x!==id);
   else if(s.party.length<3) s.party.push(id);
   render("party");
  });
 }
 if(page==="map"){
  document.getElementById("battle")?.addEventListener("click",()=>startBattle(false));
  document.getElementById("event")?.addEventListener("click",()=>eventChoice());
  document.getElementById("boss")?.addEventListener("click",()=>startBattle(true));
  document.getElementById("newrun")?.addEventListener("click",resetRun);
 }
}
function doPull(count,cost){
 if(s.gems<cost)return;
 s.gems-=cost;
 let arr=[]; for(let i=0;i<count+s.multiBonus;i++) arr.push(pullOne());
 if(s.party.length<3){
   for(const c of arr){ if(s.party.length<3) s.party.push(c.id); }
 }
 const r=document.getElementById("results");
 r.innerHTML=arr.map((c,i)=>`<div class="resultline pulse" style="animation-delay:${i*0.05}s">
 <span class="${c.rarity}"><b>${c.rarity}</b> ${c.name}</span><span>ATK ${c.atk}</span></div>`).join("");
 save(); document.querySelector(".resources").innerHTML=`<div class="chip">💎 ${s.gems}</div><div class="chip">🪙 ${s.gold}</div>`;
}
function eventChoice(){
 const e=document.getElementById("encounter");
 e.innerHTML=`<div class="card pulse"><h2>ガチャ改造装置</h2>
 <p class="sub">どちらか1つだけ選択。</p>
 <button class="btn" id="upRate">SSR率 +5%</button>
 <button class="btn gold" id="upMulti">10連の排出数 +1</button>
 </div>`;
 document.getElementById("upRate").onclick=()=>{s.rateBonus+=5;s.floor++;render("map")};
 document.getElementById("upMulti").onclick=()=>{s.multiBonus++;s.floor++;render("map")};
}
function startBattle(boss){
 if(s.party.length===0){ alert("先にキャラを編成して！"); return; }
 const party=s.party.map(id=>s.roster.find(c=>c.id===id)).filter(Boolean);
 let pHP=party.reduce((a,c)=>a+c.hp,0);
 const pMax=pHP;
 let eHP=boss?260:90+s.floor*35;
 const eMax=eHP;
 const enemyAtk=boss?24:10+s.floor*4;
 const panel=document.getElementById("encounter");
 panel.innerHTML=`<div class="card pulse"><h2>${boss?"塔の管理者":"異形エネミー"}</h2>
 <div class="battlefield">
  <div class="fighter"><b>PARTY</b><div class="hpbar"><div class="hpfill" id="php"></div></div><span id="pnum"></span></div>
  <div class="fighter enemy"><b>ENEMY</b><div class="hpbar"><div class="hpfill" id="ehp"></div></div><span id="enum"></span></div>
 </div>
 <button class="btn" id="attack">攻撃する</button>
 <div class="log" id="log"></div></div>`;
 function update(){
  document.getElementById("php").style.width=Math.max(0,pHP/pMax*100)+"%";
  document.getElementById("ehp").style.width=Math.max(0,eHP/eMax*100)+"%";
  document.getElementById("pnum").textContent=`${Math.max(0,pHP)} / ${pMax}`;
  document.getElementById("enum").textContent=`${Math.max(0,eHP)} / ${eMax}`;
 }
 function log(t){const l=document.getElementById("log");l.innerHTML+=t+"<br>";l.scrollTop=l.scrollHeight;}
 update();
 document.getElementById("attack").onclick=()=>{
  let dmg=party.reduce((a,c)=>a+c.atk,0)+Math.floor(Math.random()*12);
  if(Math.random()<0.18){dmg=Math.floor(dmg*1.7);log("✨ クリティカル！");}
  eHP-=dmg; log(`味方の総攻撃！ ${dmg}ダメージ`);
  if(eHP<=0){
   update(); const gemReward=boss?8:3; const goldReward=boss?50:12+s.floor*4;
   s.gems+=gemReward;s.gold+=goldReward;s.victories++;
   log(`勝利！ 💎${gemReward} / 🪙${goldReward} 獲得`);
   document.getElementById("attack").disabled=true;
   setTimeout(()=>{ if(boss){s.runOver=true;} else {s.floor++;} render("map"); },700);
   return;
  }
  const hit=enemyAtk+Math.floor(Math.random()*8); pHP-=hit; log(`敵の攻撃！ ${hit}ダメージ`);
  update();
  if(pHP<=0){
   log("敗北…。石2個を失って拠点へ戻る。");
   s.gems=Math.max(0,s.gems-2);
   document.getElementById("attack").disabled=true;
   setTimeout(()=>render("home"),800);
  }
 };
}
function resetRun(){
 s={gems:12,gold:0,floor:1,bossFloor:5,pulls:0,roster:[],party:[],rateBonus:0,multiBonus:0,freeReroll:false,runOver:false,victories:0};
 save(); render("home");
}
nav(); render("home");
</script>
</body>
</html>
