<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>GACHA ROGUE v0.2</title>
<style>
:root{
  --bg:#08101f;--panel:#131c33;--panel2:#1b2746;--text:#f3f6ff;
  --muted:#93a0bd;--accent:#8171ff;--accent2:#53d6ff;--gold:#ffd166;
  --danger:#ff6482;--green:#68e4a4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#08101f;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  background:
    radial-gradient(circle at 50% 0%,#1c2b58 0,#10192f 28%,#08101f 62%,#050a14 100%);
}
button{font:inherit;touch-action:manipulation}
#app{max-width:460px;margin:0 auto;min-height:100vh;padding:16px 14px 118px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:900;letter-spacing:.08em}
.res{display:flex;gap:7px}
.pill{font-size:12px;padding:7px 9px;border-radius:999px;background:#ffffff0e;border:1px solid #ffffff16}
.card{background:linear-gradient(180deg,#17213b,#11192d);border:1px solid #ffffff16;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 16px 34px #0004}
.hero{background:linear-gradient(135deg,#7567ff2e,#49d6ff12),linear-gradient(180deg,#1d294b,#121a31)}
h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 10px}p{margin:0}
.sub{font-size:13px;line-height:1.55;color:var(--muted)}
.badges{margin-top:12px}
.badge{display:inline-block;margin:0 5px 5px 0;padding:5px 8px;border-radius:9px;background:#ffffff0e;font-size:11px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 12px;margin-top:9px;font-weight:900;color:#fff;background:linear-gradient(135deg,#8b76ff,#6258ff);box-shadow:0 8px 20px #6a5fff33}
.btn.secondary{background:#263352;box-shadow:none}.btn.gold{background:linear-gradient(135deg,#d99f2f,#ffc34d);color:#181207}.btn.danger{background:linear-gradient(135deg,#ff5f7f,#e64c6b)}
.btn:disabled{opacity:.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.unit{min-height:112px;padding:10px;border:1px solid #ffffff14;background:#ffffff08;border-radius:14px}
.unit.selected{outline:2px solid var(--accent2);background:#49d6ff10}
.rarity{font-weight:900;font-size:11px}.SSR{color:#ffd166}.SR{color:#c0a5ff}.R{color:#76d9ff}.N{color:#b7c0d1}
.name{font-size:13px;font-weight:800;margin-top:6px}.stat{font-size:11px;color:var(--muted);line-height:1.45;margin-top:5px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0d}.row:last-child{border-bottom:0}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice .btn{min-height:86px;margin-top:0}
.tiny{font-size:11px;color:var(--muted)}
.battle{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fighter{background:#ffffff08;border:1px solid #ffffff12;border-radius:13px;padding:10px}
.hpbar{height:10px;border-radius:999px;background:#ffffff12;overflow:hidden;margin:7px 0}.hpfill{height:100%;background:linear-gradient(90deg,#62e6a6,#a1ef6f)}.enemy .hpfill{background:linear-gradient(90deg,#ff6684,#ffb05e)}
.log{height:150px;overflow:auto;background:#070b15;border:1px solid #ffffff0d;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;color:#c7d0e8;margin-top:10px}
.navwrap{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,#08101f 25%,#08101f)}
.nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;background:#111a30e8;border:1px solid #ffffff17;border-radius:19px;padding:8px;backdrop-filter:blur(12px)}
.nav button{border:0;border-radius:12px;background:transparent;color:#8f9bb7;padding:10px 2px;font-size:12px;font-weight:900}.nav button.active{background:#ffffff0e;color:white}
.error{border-color:#ff648277;background:#4b1324}
.center{text-align:center}
</style>
</head>
<body>
<div id="app">
  <div class="card hero">
    <h1>GACHA ROGUE</h1>
    <p class="sub">読み込み中…。この表示のままなら「データをリセット」を押してください。</p>
    <button class="btn danger" onclick="hardReset()">データをリセット</button>
  </div>
</div>

<div class="navwrap">
  <div class="nav">
    <button id="nav-home" onclick="showPage('home')">拠点</button>
    <button id="nav-gacha" onclick="showPage('gacha')">ガチャ</button>
    <button id="nav-party" onclick="showPage('party')">編成</button>
    <button id="nav-map" onclick="showPage('map')">進行</button>
  </div>
</div>

<script>
(function(){
"use strict";

var KEY="gachaRogueV02";

var chars=[
{name:"アカリ",rarity:"SSR",atk:18,hp:72,skill:"灼熱"},
{name:"ルナ",rarity:"SSR",atk:16,hp:78,skill:"月蝕"},
{name:"ノア",rarity:"SSR",atk:20,hp:64,skill:"零距離"},
{name:"ミオ",rarity:"SR",atk:13,hp:62,skill:"加速"},
{name:"レイ",rarity:"SR",atk:12,hp:68,skill:"障壁"},
{name:"ユナ",rarity:"SR",atk:14,hp:58,skill:"連撃"},
{name:"シロ",rarity:"R",atk:9,hp:52,skill:"応援"},
{name:"クロ",rarity:"R",atk:10,hp:48,skill:"毒針"},
{name:"ハナ",rarity:"R",atk:8,hp:56,skill:"治癒"},
{name:"モブA",rarity:"N",atk:6,hp:42,skill:"気合"},
{name:"モブB",rarity:"N",atk:5,hp:46,skill:"根性"},
{name:"モブC",rarity:"N",atk:7,hp:38,skill:"勢い"}
];

function defaults(){
 return {gems:12,gold:0,floor:1,bossFloor:5,pulls:0,roster:[],party:[],
 rateBonus:0,multiBonus:0,runOver:false,victories:0,nextId:1};
}

var state=defaults();

function load(){
 try{
  var raw=localStorage.getItem(KEY);
  if(raw){
   var obj=JSON.parse(raw);
   if(obj && typeof obj==="object") state=obj;
  }
 }catch(e){ state=defaults(); }
 if(!state.roster) state.roster=[];
 if(!state.party) state.party=[];
 if(typeof state.nextId!=="number") state.nextId=1;
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
}

window.hardReset=function(){
 try{localStorage.removeItem(KEY);}catch(e){}
 state=defaults();
 showPage("home");
};

function esc(s){
 return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function header(){
 return '<div class="topbar"><div class="logo">GACHA ROGUE</div><div class="res"><div class="pill">💎 '+state.gems+'</div><div class="pill">🪙 '+state.gold+'</div></div></div>';
}
function activate(page){
 var names=["home","gacha","party","map"];
 for(var i=0;i<names.length;i++){
  var b=document.getElementById("nav-"+names[i]);
  if(b) b.className=(names[i]===page?"active":"");
 }
}
function partyNames(){
 var out=[];
 for(var i=0;i<state.party.length;i++){
  for(var j=0;j<state.roster.length;j++){
   if(state.roster[j].id===state.party[i]) out.push(state.roster[j].name);
  }
 }
 return out.length?out.join(" / "):"未編成";
}

window.showPage=function(page){
 try{
  activate(page);
  var html=header();
  if(page==="gacha") html+=pageGacha();
  else if(page==="party") html+=pageParty();
  else if(page==="map") html+=pageMap();
  else html+=pageHome();
  document.getElementById("app").innerHTML=html;
  save();
 }catch(e){
  document.getElementById("app").innerHTML='<div class="card error"><h2>エラーが発生しました</h2><p class="sub">'+esc(e.message||e)+'</p><button class="btn danger" onclick="hardReset()">データをリセット</button></div>';
 }
};

function pageHome(){
 return '<div class="card hero"><div class="tiny">RUN '+(state.victories+1)+'</div><h1>ガチャを壊して、塔を登れ。</h1>'+
 '<p class="sub">引いたキャラだけで進むローグライク。道中でSSR率や10連そのものを強化する。</p>'+
 '<div class="badges"><span class="badge">SSR率 '+(3+state.rateBonus)+'%</span><span class="badge">'+state.floor+'F / '+state.bossFloor+'F</span></div></div>'+
 '<div class="card"><h2>現在のラン</h2><p class="sub">勝利数 '+state.victories+' ／ 累計ガチャ '+state.pulls+'回 ／ 所持 '+state.roster.length+'体</p>'+
 '<button class="btn" onclick="showPage(\'gacha\')">まずガチャを引く</button><button class="btn secondary" onclick="showPage(\'map\')">塔を進む</button></div>'+
 '<div class="card"><h2>試作版 v0.2</h2><p class="sub">iPhone Safari向けの互換性修正版。古い保存データとは分離している。</p>'+
 '<button class="btn danger" onclick="hardReset()">このランを完全リセット</button></div>';
}

function pageGacha(){
 return '<div class="card"><h2>召喚端末</h2><p class="sub">SSR基本3%。単発1💎、10連9💎。</p>'+
 '<button class="btn" '+(state.gems<1?'disabled':'')+' onclick="pull(1,1)">単発ガチャ 1💎</button>'+
 '<button class="btn gold" '+(state.gems<9?'disabled':'')+' onclick="pull(10,9)">10連ガチャ 9💎</button><div id="results"></div></div>'+
 '<div class="card"><h2>現在のガチャ性能</h2><div class="row"><span>SSR率</span><b>'+(3+state.rateBonus)+'%</b></div>'+
 '<div class="row"><span>10連追加排出</span><b>+'+state.multiBonus+'</b></div><div class="row"><span>所持キャラ</span><b>'+state.roster.length+'</b></div></div>';
}

function rarityRoll(){
 var x=Math.random()*100, ssr=Math.min(35,3+state.rateBonus);
 if(x<ssr)return "SSR";
 if(x<ssr+15)return "SR";
 if(x<ssr+45)return "R";
 return "N";
}
function onePull(){
 var r=rarityRoll(), pool=[],i;
 for(i=0;i<chars.length;i++) if(chars[i].rarity===r) pool.push(chars[i]);
 var base=pool[Math.floor(Math.random()*pool.length)];
 var c={id:state.nextId++,name:base.name,rarity:base.rarity,atk:base.atk,hp:base.hp,skill:base.skill};
 state.roster.push(c); state.pulls++; return c;
}
window.pull=function(count,cost){
 if(state.gems<cost)return;
 state.gems-=cost;
 var total=count+(count===10?state.multiBonus:0), arr=[],i;
 for(i=0;i<total;i++) arr.push(onePull());
 for(i=0;i<arr.length && state.party.length<3;i++) state.party.push(arr[i].id);
 save();
 showPage("gacha");
 var box=document.getElementById("results");
 if(box){
  var h='<div style="margin-top:12px">';
  for(i=0;i<arr.length;i++) h+='<div class="row"><span class="'+arr[i].rarity+'"><b>'+arr[i].rarity+'</b> '+esc(arr[i].name)+'</span><span>ATK '+arr[i].atk+'</span></div>';
  box.innerHTML=h+'</div>';
 }
};

function pageParty(){
 var h='<div class="card"><h2>3人編成</h2><p class="sub" style="margin-bottom:10px">キャラをタップして最大3人まで選択。</p><div class="grid">';
 if(!state.roster.length) h+='<p class="sub">まだキャラがいない。</p>';
 for(var i=0;i<state.roster.length;i++){
  var c=state.roster[i], sel=state.party.indexOf(c.id)!==-1;
  h+='<button class="unit '+(sel?'selected':'')+'" onclick="toggleParty('+c.id+')"><div class="rarity '+c.rarity+'">'+c.rarity+'</div><div class="name">'+esc(c.name)+'</div><div class="stat">ATK '+c.atk+'<br>HP '+c.hp+'<br>'+esc(c.skill)+'</div></button>';
 }
 h+='</div></div><div class="card"><h2>現在の編成</h2><p class="sub">'+esc(partyNames())+'</p></div>';
 return h;
}
window.toggleParty=function(id){
 var idx=state.party.indexOf(id);
 if(idx!==-1) state.party.splice(idx,1);
 else if(state.party.length<3) state.party.push(id);
 showPage("party");
};

function pageMap(){
 if(state.runOver){
  return '<div class="card hero center"><h1>RUN CLEAR!</h1><p class="sub">塔の管理者を撃破した。</p><button class="btn" onclick="hardReset()">新しいランを開始</button></div>';
 }
 var boss=state.floor===state.bossFloor;
 var h='<div class="card hero"><div class="tiny">'+(boss?'BOSS FLOOR':'FLOOR '+state.floor)+'</div><h1>'+(boss?'最終ボス':'次の分岐')+'</h1><p class="sub">'+(boss?'ここを勝てばランクリア。':'どちらかを選んで塔を進む。')+'</p></div>';
 if(boss) h+='<div class="card"><button class="btn danger" onclick="startBattle(true)">ボスに挑む</button></div>';
 else h+='<div class="choice"><button class="btn" onclick="startBattle(false)">⚔️ 戦闘<br><span class="tiny">勝利で石と金</span></button><button class="btn secondary" onclick="showUpgrade()">🧪 改造<br><span class="tiny">ガチャ性能を変える</span></button></div>';
 h+='<div class="card"><h2>パーティ</h2><p class="sub">'+esc(partyNames())+'</p></div><div id="encounter"></div>';
 return h;
}

window.showUpgrade=function(){
 var e=document.getElementById("encounter");
 if(!e)return;
 e.innerHTML='<div class="card"><h2>ガチャ改造装置</h2><p class="sub">どちらか1つだけ選択。</p><button class="btn" onclick="takeUpgrade(1)">SSR率 +5%</button><button class="btn gold" onclick="takeUpgrade(2)">10連の排出数 +1</button></div>';
};
window.takeUpgrade=function(type){
 if(type===1)state.rateBonus+=5; else state.multiBonus+=1;
 state.floor+=1; showPage("map");
};

function partyObjects(){
 var out=[],i,j;
 for(i=0;i<state.party.length;i++){
  for(j=0;j<state.roster.length;j++) if(state.roster[j].id===state.party[i]) out.push(state.roster[j]);
 }
 return out;
}
window.startBattle=function(boss){
 var party=partyObjects();
 if(!party.length){ alert("先にキャラを編成して！"); return; }
 var pHP=0,i; for(i=0;i<party.length;i++)pHP+=party[i].hp;
 var pMax=pHP, eHP=boss?260:90+state.floor*35, eMax=eHP, enemyAtk=boss?24:10+state.floor*4;
 var e=document.getElementById("encounter");
 e.innerHTML='<div class="card"><h2>'+(boss?'塔の管理者':'異形エネミー')+'</h2><div class="battle"><div class="fighter"><b>PARTY</b><div class="hpbar"><div class="hpfill" id="php"></div></div><span id="pnum"></span></div><div class="fighter enemy"><b>ENEMY</b><div class="hpbar"><div class="hpfill" id="ehp"></div></div><span id="enum"></span></div></div><button class="btn" id="attackBtn">攻撃する</button><div class="log" id="battleLog"></div></div>';
 function update(){
  document.getElementById("php").style.width=Math.max(0,pHP/pMax*100)+"%";
  document.getElementById("ehp").style.width=Math.max(0,eHP/eMax*100)+"%";
  document.getElementById("pnum").innerHTML=Math.max(0,pHP)+" / "+pMax;
  document.getElementById("enum").innerHTML=Math.max(0,eHP)+" / "+eMax;
 }
 function addLog(t){var l=document.getElementById("battleLog");l.innerHTML+=esc(t)+"<br>";l.scrollTop=l.scrollHeight;}
 update();
 document.getElementById("attackBtn").onclick=function(){
  var dmg=0,k; for(k=0;k<party.length;k++)dmg+=party[k].atk;
  dmg+=Math.floor(Math.random()*12);
  if(Math.random()<0.18){dmg=Math.floor(dmg*1.7);addLog("✨ クリティカル！");}
  eHP-=dmg;addLog("味方の総攻撃！ "+dmg+"ダメージ");
  if(eHP<=0){
   update();
   var gemReward=boss?8:3, goldReward=boss?50:12+state.floor*4;
   state.gems+=gemReward;state.gold+=goldReward;state.victories+=1;
   addLog("勝利！ 💎"+gemReward+" / 🪙"+goldReward+" 獲得");
   document.getElementById("attackBtn").disabled=true;
   if(boss)state.runOver=true; else state.floor+=1;
   save();
   setTimeout(function(){showPage("map");},700);
   return;
  }
  var hit=enemyAtk+Math.floor(Math.random()*8);pHP-=hit;addLog("敵の攻撃！ "+hit+"ダメージ");update();
  if(pHP<=0){
   addLog("敗北…。石2個を失って拠点へ戻る。");
   state.gems=Math.max(0,state.gems-2);save();document.getElementById("attackBtn").disabled=true;
   setTimeout(function(){showPage("home");},800);
  }
 };
};

load();
showPage("home");
})();
</script>
</body>
</html>
